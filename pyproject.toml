[project]
name = "photoctl"
version = "0.1.0"
description = "Archive Apple Photos originals to S3 with small, metadata-rich copies and a searchable catalog"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3[crt]>=1.43.111",
    "click>=8.5.0",
    "jsonschema>=4.26.0",
    "osxphotos>=0.77.2",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.0",
]

[project.scripts]
photoctl = "photoctl.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.169.0",
    "moto[s3,server]>=5.2.3",
    "pytest>=9.1.1",
]
